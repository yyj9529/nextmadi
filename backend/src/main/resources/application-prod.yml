spring:
  config:
    import: ${PHRASELOG_SECRETS_IMPORT:optional:aws-secretsmanager:/phraselog/prod/backend/}
  datasource:
    url: ${PHRASELOG_DB_URL}
    username: ${PHRASELOG_DB_USERNAME}
    password: ${PHRASELOG_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${PHRASELOG_FLYWAY_ENABLED:true}
  cloud:
    aws:
      # 기본 프로필에서 꺼둔 Secrets Manager를 prod에서 다시 켠다.
      # 위 spring.config.import의 aws-secretsmanager 로딩과 런타임 클라이언트가 활성화된다.
      secretsmanager:
        enabled: true

phraselog:
  internal-auth:
    # Secrets Manager의 INTERNAL_AUTH_SECRET를 주입. 키 회전 오버랩 기간에는
    # "새비밀,이전비밀" 형태로 쉼표 구분 값을 넣으면 코드 변경 없이 오버랩이 된다(검증기는 앞에서부터 시도).
    secrets: ${INTERNAL_AUTH_SECRET}
