# 로컬 디버깅 전용 P6Spy 설정. application-local.yml이 P6SpyDriver를 연결할 때만 로드된다.
# 실제 파라미터 값이 박힌 '완성된 SQL' 한 건만 SLF4J('p6spy' 로거)로 남긴다.
# prod/CI는 P6Spy 드라이버를 쓰지 않으므로(org.postgresql.Driver 직접) 이 파일은 로드되지 않는다.

# P6Spy가 감쌀 실제 JDBC 드라이버.
driverlist=org.postgresql.Driver

# 콘솔 stdout이 아니라 SLF4J로 출력 → logback 콘솔 패턴(application-local.yml)이 그대로 적용된다.
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 타임스탬프·연결ID·소요시간 같은 파이프(|) 필드를 모두 빼고, 값이 치환된 완성 SQL만 출력한다.
# %(sql) = ? 자리에 실제 바인딩 값이 박힌 SQL. 맨 앞 \n 덕분에 로거 프리픽스 다음 줄부터 SELECT가 시작된다.
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=\n%(sql)

# 실제 실행 구문(statement)만 남기고 결과셋/커밋/롤백/배치/내부정보 카테고리는 제외한다.
# (commit/rollback을 빼는 이유: 그 카테고리는 sql이 비어 빈 줄만 찍히기 때문.)
excludecategories=info,debug,result,resultset,batch,commit,rollback
