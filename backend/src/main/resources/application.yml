spring:
  application:
    name: phraselog-backend
  flyway:
    enabled: ${PHRASELOG_FLYWAY_ENABLED:false}
    locations: classpath:db/migration

phraselog:
  api:
    base-path: /api/v1

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash
