plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.15'
    id 'com.diffplug.spotless' version '8.6.0'
}

group = 'com.phraselog'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.15')
    implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:3.3.0')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager'
    // TTS 오디오 캐시 저장/서명 URL (#30). prod에서만 실제 S3에 붙고, 기본/테스트 프로필에서는
    // spring.cloud.aws.s3.enabled=false로 auto-config를 꺼서 region 없는 컨텍스트 로딩이 깨지지
    // 않게 한다(Secrets Manager와 동일한 게이트 방식). 버전은 위 3.3.0 BOM이 관리.
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
    // JSON Schema 검증 (AI 응답 스키마 검증, E04.1). org.json 브리지 포함.
    // Maven Central 최신 안정판, 검증일 2026-06-17.
    implementation 'com.github.erosb:everit-json-schema:1.14.6'

    // BFF 내부 인증 토큰 검증 (#20, ADR-010). HS256 JWS 서명/검증 전용 JOSE 라이브러리.
    // Spring Security를 끌어오지 않고 MACVerifier로 알고리즘을 명시적으로 고정한다.
    // 버전은 BOM이 관리하지 않으므로 명시 핀. Maven Central 최신 안정(확인 2026-06-18): 10.9.1.
    implementation 'com.nimbusds:nimbus-jose-jwt:10.9.1'

    runtimeOnly 'org.postgresql:postgresql'

    // 로컬 디버깅 전용: 실제 파라미터 값이 박힌 완성 SQL을 로깅한다(spy.properties + application-local.yml).
    // developmentOnly라 배포 bootJar에는 포함되지 않는다. prod/CI는 P6Spy 드라이버를 쓰지 않으므로
    // (org.postgresql.Driver 직접 사용) 완전히 무해. Maven Central 안정판 3.9.1(검증 2026-07-22).
    developmentOnly 'p6spy:p6spy:3.9.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()

    // Tests run under the `test` profile. Without a development profile the backend refuses to
    // start with the committed development internal auth secret (#175), and any
    // @SpringBootTest that relies on the application.yml default would fail to load.
    systemProperty 'spring.profiles.active', 'test'

    // Print the pass/fail/SKIPPED tally. The Testcontainers suites are annotated
    // @Testcontainers(disabledWithoutDocker = true), so on a machine without Docker they are
    // silently skipped and the build still reports SUCCESS. Without this summary a green CI run
    // cannot be distinguished from one where every DB-backed test was skipped — which matters most
    // exactly when a migration needs proving.
    testLogging {
        events 'skipped', 'failed'
        exceptionFormat 'full'
    }
    afterSuite { desc, result ->
        if (desc.parent == null) {
            logger.lifecycle(
                "Test summary: ${result.testCount} tests, ${result.successfulTestCount} passed, " +
                "${result.failedTestCount} failed, ${result.skippedTestCount} skipped")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('bootJar') {
    archiveFileName = 'phraselog-backend.jar'
}

// Bundle the repo-root versioned prompt files onto the backend classpath (under
// prompts/) so the prompt loader resolves them via ClassPathResource inside the
// deployed fat jar. Repo root stays the single source of truth; backend consumes.
// See docs/exec-plans/2026-06-16-prompt-loader.md (decision D1).
processResources {
    from(file("../prompts")) {
        into 'prompts'
    }
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'misc', {
        target '*.gradle', '*.md', 'src/**/*.yml', 'src/**/*.yaml'
        trimTrailingWhitespace()
        endWithNewline()
    }
}
