plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.15'
    id 'com.diffplug.spotless' version '8.6.0'
}

group = 'com.phraselog'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.15')
    implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:3.3.0')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager'
    // JSON Schema 검증 (AI 응답 스키마 검증, E04.1). org.json 브리지 포함.
    // Maven Central 최신 안정판, 검증일 2026-06-17.
    implementation 'com.github.erosb:everit-json-schema:1.14.6'

    // BFF 내부 인증 토큰 검증 (#20, ADR-010). HS256 JWS 서명/검증 전용 JOSE 라이브러리.
    // Spring Security를 끌어오지 않고 MACVerifier로 알고리즘을 명시적으로 고정한다.
    // 버전은 BOM이 관리하지 않으므로 명시 핀. Maven Central 최신 안정(확인 2026-06-18): 10.9.1.
    implementation 'com.nimbusds:nimbus-jose-jwt:10.9.1'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('bootJar') {
    archiveFileName = 'phraselog-backend.jar'
}

// Bundle the repo-root versioned prompt files onto the backend classpath (under
// prompts/) so the prompt loader resolves them via ClassPathResource inside the
// deployed fat jar. Repo root stays the single source of truth; backend consumes.
// See docs/exec-plans/2026-06-16-prompt-loader.md (decision D1).
processResources {
    from(file("../prompts")) {
        into 'prompts'
    }
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'misc', {
        target '*.gradle', '*.md', 'src/**/*.yml', 'src/**/*.yaml'
        trimTrailingWhitespace()
        endWithNewline()
    }
}
