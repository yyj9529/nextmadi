name: S07 offline checks

# Pull requests never invoke paid models. See the cost-control execution plan.
on:
  pull_request:
    paths:
      - "prompts/s07/**"
      - "eval/s07-analysis/**"
      - "backend/**/analysis/**"
      - "backend/**/schemas/s07*"
      - ".github/workflows/eval.yml"

permissions:
  contents: read

jobs:
  s07-offline:
    name: S07 offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing evaluation test dependencies
        run: pip install -r eval/s07-analysis/requirements.txt
      - name: Run no-API unit tests
        run: python -m unittest discover -s eval/s07-analysis -p 'test_*.py' -v
      - name: Record verification scope
        run: echo "Offline tests only. Actual model quality and paid evaluation were not run."
